name: modeef
description: "Modeef — Luxury Saudi Heritage & Tourism Experience Platform"
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Networking & Data
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  intl: ^0.20.3

  # UI, Icons, Typography & Animations
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  font_awesome_flutter: ^10.9.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  moyasar: ^3.0.5
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
